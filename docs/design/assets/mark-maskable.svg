<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Study Tracker">
  <title>Study Tracker</title>
  <!-- Maskable icon: the glyph sits inside the 80 percent safe circle (r=205 at center 256),
       so a circular, squircle or rounded mask never clips a tread. -->
  <rect width="512" height="512" fill="#0F1A1E"/>
  <g transform="translate(96 96) scale(10)">
    <path d="M4 27 L28 5" fill="none" stroke="#C8A24A" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="square"/>
    <path d="M4 27 L4 21 L10 21 L10 16 L16 16 L16 12 L22 12 L22 7 L28 7"
          fill="none" stroke="#C8A24A" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>
</svg>
