name: Build and Deploy

# Dockerized GHCR model (per cron-server's runbook, adapted for this
# monorepo): build the image in CI from the repo root using
# apps/backend/Dockerfile, push to GHCR, then SSH in and `compose pull` +
# one-off migrate + `compose up -d`. The server only pulls and runs — it
# never builds.
#
# `test` gates `build-and-deploy` (see `needs:` below): migrate/typecheck/test
# must all pass against a real throwaway Postgres before anything is built or
# pushed, so a red suite can never reach deploy.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch: {}

concurrency:
  group: deploy-cfa-backend-api
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cfa_ci
          POSTGRES_PASSWORD: cfa_ci
          POSTGRES_DB: cfa_study_tracker_ci
        ports:
          - 5432:5432
        # Waits for Postgres to actually accept connections before any later
        # step runs - the service container starts in parallel with
        # `actions/checkout`, not necessarily before pnpm needs it.
        options: >-
          --health-cmd "pg_isready -U cfa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cfa_ci:cfa_ci@localhost:5432/cfa_study_tracker_ci
      # Dummy, non-production values - this job never talks to a real
      # provider or sends a real push; VAPID keys still have to be a
      # structurally valid keypair because web-push validates key shape at
      # module load (see apps/backend/.env.test's own comment on this).
      JWT_SECRET: ci-test-jwt-secret-not-for-production-use-only
      JWT_TTL_HOURS: "72"
      CRON_SECRET: ci-test-cron-secret-not-for-production-use-only
      CORS_ALLOW_ORIGINS: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-placeholder-google-client-id
      GOOGLE_CLIENT_SECRET: ci-placeholder-google-client-secret
      GITHUB_CLIENT_ID: ci-placeholder-github-client-id
      GITHUB_CLIENT_SECRET: ci-placeholder-github-client-secret
      OAUTH_REDIRECT_BASE: http://localhost:3000
      FRONTEND_BASE_URL: http://localhost:5173
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_MAX_REQUESTS: "240"
      VAPID_PUBLIC_KEY: BDBa8LuxVvDmU10XXqzWpM47YhgJl2HgLxBpG3zOVHiCAcg1VHe8OqycCWaoG6wDpztgObJdl5zxlEK0auLo9rI
      VAPID_PRIVATE_KEY: IkLduRz1c6RbwZUlaDhy15Suv_AWC86_bSp1PU_Q40M
      VAPID_SUBJECT: mailto:ci@localhost
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to the CI database
        run: pnpm --filter backend exec prisma migrate deploy

      - name: Typecheck
        run: pnpm --filter backend typecheck

      - name: Test
        run: pnpm --filter backend test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR namespaces must be lowercase; the owner login may be mixed-case.
      - name: Resolve lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cfa-study-tracker-api" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Host cron lives outside the web container (12-factor), but its
      # schedule and wrapper script are committed here so changing the
      # schedule means editing this repo and pushing, not SSHing in by
      # hand. Copies the two files to a staging path; the SSH step below
      # installs them for real and (re-)writes deploy's crontab entry.
      - name: Copy cron files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "apps/backend/deploy/cfa-cron-tick.sh,apps/backend/deploy/cron-schedule"
          target: "/srv/scripts/.cfa-cron-staging"
          strip_components: 3

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.APP_DIR }}"
            docker compose pull
            # Migrations as a one-off process (12-factor admin task), not in the web container.
            docker compose run --rm app sh -c 'node "$(find /app/node_modules/.pnpm -maxdepth 1 -name "prisma@*" -print -quit)/node_modules/prisma/build/index.js" migrate deploy'
            docker compose up -d
            docker image prune -f

            # Install the cron wrapper + (re-)write deploy's crontab entry
            # from whatever's currently committed - idempotent, so a
            # schedule change in the repo takes effect on the next push
            # with no manual server step.
            mv /srv/scripts/.cfa-cron-staging/cfa-cron-tick.sh /srv/scripts/cfa-cron-tick.sh
            chmod 700 /srv/scripts/cfa-cron-tick.sh
            ls -la /srv/scripts/.cfa-cron-staging/ || echo "STAGING DIR MISSING"
            SCHEDULE=$(cat /srv/scripts/.cfa-cron-staging/cron-schedule)
            echo "DEBUG SCHEDULE=[$SCHEDULE]"
            rm -rf /srv/scripts/.cfa-cron-staging
            NEWCRON=$(crontab -l 2>/dev/null | grep -v cfa-cron-tick.sh; echo "$SCHEDULE /srv/scripts/cfa-cron-tick.sh >> /srv/scripts/cfa-cron-tick.log 2>&1")
            echo "DEBUG NEWCRON=[$NEWCRON]"
            echo "$NEWCRON" | crontab -
            echo "DEBUG crontab exit=$?"
            crontab -l
